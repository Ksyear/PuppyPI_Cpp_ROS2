# Protocol v2 수신기 설정. 상한: 전진 25 cm/s, 후진 5 cm/s, 회전 0.28 rad/s(16°/s).
# 후진 상한은 보행 중 무릎 관절이 범위를 넘지 않도록 낮게 둔다. 값을 올리기 전에 로봇을 받친 상태에서 먼저 확인할 것.
# forward/turn(-1~1, 단위 없음) → x = forward × max_forward(전진) / max_reverse(후진) [cm/s],
#                                  yaw = turn × max_yaw_rate [rad/s], turn>0 = 좌회전(REP-103).
vr_protocol_v2_receiver:
  ros__parameters:
    bind_address: 0.0.0.0
    port: 5001                      # VR PuppyPiV2Client.cs 기본값과 동일
    # 마지막 인정 command 후 정지까지. 0.25 s 에서는 Wi-Fi(휴대폰 핫스팟) 지연 튐마다 걷다가 멈추고 다시 누르기를 요구해
    # 0.4 s 로 늘림(16→25 cm/s 에서 추가 이동 ≤4 cm). Quest 앱은 자체 ACK 타임아웃 0.3 s 로 먼저 멈춘다.
    command_timeout_sec: 0.4
    client_lease_timeout_sec: 1.0   # VR 소켓 재시도 1.1s 와 맞물림(같은 UUID 로 재획득)
    poll_interval_sec: 0.02
    max_forward_cm_s: 25.0
    max_reverse_cm_s: 5.0           # 후진 상한(엔진 무릎 범위). 올리지 말 것
    # 2026-11-04 후진 환산 폭: forward<0 이면 x = forward × 10 을 계산한 뒤 -5 cm/s 로 제한한다.
    # 앱 속도 50 % 에서 끝까지 당기면 2.5 → 5.0 cm/s(상한). 0 이면 이전 동작(× max_reverse).
    reverse_scale_cm_s: 10.0
    # 2026-11-04 출발 대기: 정지 상태에서 출발할 때만 이 시간 동안 기다렸다가 그때의 입력으로 출발한다.
    # 엄지·손을 미는 동안의 작은 첫 값(예: 3 cm/s)이 보행 한 주기 동안 고정되어 머뭇거리는 것을 막는다.
    # 정지는 기다리지 않는다. 출발 반응이 이만큼 늦어진다. 0 = 끔.
    start_hold_sec: 0.2
    # 2026-11-05 회전 중 작은 전진·후진 무시: 회전 입력이 있고 |x| < 이 값이면 x = 0 → 제자리 회전 자세 유지.
    # 휴대폰 조이스틱으로 좌우를 밀 때 엄지가 조금 위·아래로 가면 '느린 전진(후진) + 회전'이 되어 전진 자세로 돌다
    # 넘어지는 일이 실기에서 관찰되었다. 0 = 끔.
    turn_x_deadband_cm_s: 4.0
    # 2026-11-05 경로 지정 주행: VR 이 지도 위 경유점(지도 좌표 m)을 UDP Protocol v2 `path` 로 보내면
    # '제자리 회전 → 직진' 으로 따라간다. 직진 중 몸 앞 stop_distance_m 안에 LiDAR 점이 있으면 멈추고 기다린다.
    # 조이스틱 조작·통신 끊김(watchdog)·비상정지·조종자 교체 → 경로 취소. 속도는 조이스틱 50 % 와 같게.
    path.enabled: true
    path.speed_cm_s: 12.5
    path.yaw_rate: 0.14
    path.rot_enter_deg: 15.0
    path.rot_exit_deg: 6.0
    path.heading_kp: 0.5
    path.heading_max: 0.05
    path.arrive_m: 0.10
    path.pass_m: 0.30
    path.stop_distance_m: 0.30
    path.body_front_m: 0.16
    path.half_width_m: 0.17
    path.min_obstacle_points: 2
    path.clear_hold_sec: 1.0
    path.pose_timeout_sec: 0.6
    path.scan_timeout_sec: 0.6
    max_yaw_rate_rad_s: 0.28
    # 가감속 제한 0 = 끔. 보행 엔진이 속도를 걸음 주기 단위로 바꾸므로, 램프를 두면 첫 주기에 램프 첫 값이
    # 고정되어 출발이 늦어진다.
    max_linear_accel_cm_s2: 0.0
    max_yaw_accel_rad_s2: 0.0
    publish_rate_hz: 20.0
    accept_estop_from_any_client: true
    output_topic: /puppy_control/vr/cmd_vel
    arbiter_state_topic: /puppy_control/arbiter_state
    arbiter_state_timeout_sec: 2.0
    estop_request_topic: /puppy_control/estop_request
    stats_log_period_sec: 10.0
    discovery.enabled: false       # 검색 응답기(UDP 5002)는 공개본에 없다
    discovery.port: 5002
    discovery.name: ""              # 비우면 hostname

# 카메라 UDP 송신기(camera_udp_sender) 설정. 받는 쪽 앱이 있을 때만 실행한다.
camera_udp_sender:
  ros__parameters:
    image_topic: /usb_cam/image_raw/compressed
    client_ip: ""
    client_port: 5006
    bind_port: 5006
    max_fps: 15.0
    chunk_size: 1400
    client_timeout_sec: 5.0
